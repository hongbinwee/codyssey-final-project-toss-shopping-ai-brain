name: codyssey-pg18-verify

# PG18.6 isolated verification cluster - approved PG17->18.6 Phase B.
# Original compose.yaml/.env/secret/existing DBs are unchanged. This file is
# a separate compose project with its own volume; the PG17 data volume is
# never mounted here (incompatible on-disk format).

services:
  db18:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: codyssey-pg18-verify-db
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg18data:/var/lib/postgresql
    secrets:
      - pg-password

volumes:
  pg18data:
    name: codyssey_pg18_verify_data

secrets:
  pg-password:
    file: ./.secrets/pg-password
